services:
  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-agile}-db
    environment:
      POSTGRES_USER: ${DB_USER:-agile}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agile}
      POSTGRES_DB: ${DB_NAME:-agile}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agile} -d ${DB_NAME:-agile}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./api
    container_name: ${COMPOSE_PROJECT_NAME:-agile}-api
    environment:
      DATABASE_URL: postgres://${DB_USER:-agile}:${DB_PASSWORD:-agile}@db:5432/${DB_NAME:-agile}
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5181}:4000"
    restart: unless-stopped

  web:
    build: ./web
    container_name: ${COMPOSE_PROJECT_NAME:-agile}-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5180}:80"
    restart: unless-stopped

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-agile}_pgdata
